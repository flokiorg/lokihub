services:
  relay:
    image: ghcr.io/ohstr/ncli:latest
    container_name: lokihub-dev-relay
    hostname: relay
    restart: unless-stopped
    command: ["relay", "--config", "/config/relay.yaml"]
    volumes:
      - ${DEV_DATA_DIR:-./data}/relay/relay.yaml:/config/relay.yaml:ro
      - ${DEV_DATA_DIR:-./data}/relay:/data
    ports:
      # Published to the host too so `go test -tags integration` (which runs
      # outside the compose network) can reach the same relay the backend
      # container talks to over Docker DNS as `relay:5500`. Requires a host
      # /etc/hosts entry "127.0.0.1 relay" so both sides resolve the same
      # hostname to this one relay.
      - "${RELAY_PORT:-5500}:5500"
    networks:
      - lokihub-dev

  flnd:
    build:
      # ../flnd etc. only resolve from the main checkout — a worktree lives
      # several directories deeper (.claude/worktrees/<name>/), so the same
      # relative path no longer reaches the real sibling repos. Override
      # DEV_FLND_DIR/DEV_WALLETD_DIR/DEV_FLOKICOIN_NEUTRINO_DIR (absolute
      # paths) in a worktree's .env — same pattern as DEV_DATA_DIR below.
      context: ${DEV_FLND_DIR:-../flnd}
      dockerfile: dev.Dockerfile
      additional_contexts:
        # flnd, walletd, and flokicoin-neutrino evolve in lockstep on this
        # fork; this builds flnd against whatever's on disk in these sibling
        # checkouts instead of their go.mod/go.sum-pinned versions (see
        # flnd/dev.Dockerfile).
        walletd: ${DEV_WALLETD_DIR:-../walletd}
        flokicoin-neutrino: ${DEV_FLOKICOIN_NEUTRINO_DIR:-../flokicoin-neutrino}
    container_name: lokihub-dev-flnd
    restart: unless-stopped
    volumes:
      # DEV_DATA_DIR (set in .env) points this at another checkout's
      # already-synced data/ instead of this one's own — see Justfile's
      # `just dev help`.
      - ${DEV_DATA_DIR:-./data}/flnd:/root/.flnd
    # dev.Dockerfile's ENTRYPOINT is already ["flnd"] -- only pass flags here.
    command: --configfile=/root/.flnd/flnd.conf
    healthcheck:
      test: ["CMD", "ls", "/root/.flnd/tls.cert"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "${FLND_RPC_PORT:-10005}:10005"
    networks:
      - lokihub-dev

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: lokihub-dev-backend
    restart: unless-stopped
    # ports:
    #   - "${PORT:-1610}:1610"
    environment:
      - WORK_DIR=/data
      - PORT=1610
      - NETWORK=flokicoin
      # No BASE_URL/FRONTEND_URL: both only feed the /logout redirect
      # (config.GetBaseFrontendUrl), and neither localhost:1610 nor
      # localhost:5173 is reachable from the browser - this stack is only
      # ever reached through Caddy's reverse proxy (see Caddyfile.dev),
      # on whatever host/port/tunnel fronts it. Leaving both unset makes
      # the handler fall back to a same-origin relative "/" redirect,
      # which works through the proxy regardless of how it's accessed.
      - LN_BACKEND_TYPE=FLND
      - FLND_ADDRESS=flnd:10005
      # No FLND_CERT_FILE: flnd's flnd/wrapper falls back to
      # InsecureSkipVerify when it's unset, so we don't need to distribute
      # tls.cert into this container at all.
      - FLND_MACAROON_FILE=/flnd-data/data/chain/flokicoin/main/admin.macaroon
      - RELAY=${RELAY:-ws://relay:5500}
      # Off unless .env says otherwise, matching the production default: turning
      # it on publishes a kind-11190 announcement inviting clients to an inbox, so
      # a hub should only advertise it deliberately. Set
      # PRIVATE_TRANSPORT_ENABLED=true in .env to exercise the private transport
      # end to end against this stack.
      - PRIVATE_TRANSPORT_ENABLED=${PRIVATE_TRANSPORT_ENABLED:-false}
      - LOG_LEVEL=${LOG_LEVEL:-4}
    # Docker's default nofile limit in this environment is only 1024 (vs.
    # the host's own 524288) - air's own watcher easily exceeds that, which
    # caused a "too many open files" crash-loop. Root-caused: raise the
    # limit rather than working around it elsewhere.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - .:/app
      # nmilat, at the SAME absolute path inside the container as outside.
      #
      # go.mod carries a TEMPORARY `replace` for nmilat pointing at an absolute
      # host path (see go.mod), and a replace is resolved by the compiler inside
      # this container — so without this mount `air` cannot build at all. That
      # fails in the worst available way: a crash-loop whose last SUCCESSFUL
      # binary keeps serving, so the stack looks healthy while running stale code.
      # It did exactly that for three days.
      #
      # Source and target are the same variable on purpose: the replace names one
      # absolute path, so any other mount point would not satisfy it. Read-only,
      # because a replace only ever reads the module.
      #
      # This mount and the `replace` are one unit — drop both together at release
      # time, along with DEV_NMILAT_DIR in .env.
      - ${DEV_NMILAT_DIR:?set DEV_NMILAT_DIR in .env to your nmilat checkout — go.mod replaces nmilat with an absolute path the backend container must also see}:${DEV_NMILAT_DIR}:ro
      - ${DEV_DATA_DIR:-./data}/hub:/data
      - ${DEV_DATA_DIR:-./data}/flnd:/flnd-data:ro
      - lokihub-go-mod-cache:/go/pkg/mod
      - lokihub-go-build-cache:/root/.cache/go-build
    depends_on:
      flnd:
        condition: service_healthy
      relay:
        condition: service_started
    networks:
      - lokihub-dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: lokihub-dev-frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://backend:1610
      # Bind mounts frequently don't propagate inotify events into the
      # container, silently breaking HMR — see vite.config.ts.
      - VITE_USE_POLLING=true
    depends_on:
      - backend
    networks:
      - lokihub-dev

  caddy:
    image: caddy:2-alpine
    container_name: lokihub-dev-caddy
    restart: unless-stopped
    ports:
      - "${CADDY_PORT:-5610}:80"
      - "${CADDY_HTTPS_PORT:-5611}:443"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - lokihub-caddy-data:/data
    depends_on:
      - frontend
    networks:
      - lokihub-dev

networks:
  lokihub-dev:
    driver: bridge

volumes:
  lokihub-go-mod-cache:
  lokihub-go-build-cache:
  lokihub-caddy-data:

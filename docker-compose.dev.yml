# The dev and test stack: regtest only. It has no mainnet option, port or fee
# estimator; `just dev up` refuses to start if a config names another network, and
# the backend exits if its node is not on regtest (LOKIHUB_DEV_STACK=1).
#
# Tracked configs live in dev/regtest/, data in data/regtest/ (git-ignored).
# `just dev wipe` deletes data/regtest/ for a fresh chain. The project name keeps
# containers per checkout, so a worktree can run its own stack: set
# COMPOSE_PROJECT_NAME and the *_PORT values in its .env.
name: lokihub-dev

services:
  chain:
    build:
      context: ${DEV_FLOKICOIN_DIR:-../go-flokicoin}
      dockerfile: docker/Dockerfile
    hostname: chain
    restart: unless-stopped
    # No --notls: flnd's btcd backend always uses TLS. The RPC cert is written by
    # `just dev setup` (valid for `chain` and DEV_HOST) and shared with both flnd.
    command:
      - /bin/lokid
      - --regtest
      - --txindex
      - --rejectnonstd
      - --rpcuser=dev
      - --rpcpass=dev
      - --rpclisten=0.0.0.0:25213
      - --listen=0.0.0.0:25212
      - --rpcmaxwebsockets=50
    volumes:
      - ./data/regtest/chain:/root/.lokid
    ports:
      - "${CHAIN_RPC_PORT:-25213}:25213"
    networks:
      - lokihub-dev

  # A fixed fee estimate (25 loki/vB, in loki/kvB) for both flnd, served on the
  # compose network only. flnd's btcd backend would ask lokid instead, but lokid's
  # estimatefee handler panics (go-flokicoin rpcserver.go handleEstimateFee). Drop
  # this service and both fee.url lines once the chain image is built from a
  # go-flokicoin with that fix.
  fees:
    image: busybox:1.36
    restart: unless-stopped
    command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
    volumes:
      - ./dev/regtest/fees.json:/www/fees.json:ro
    networks:
      - lokihub-dev

  relay:
    image: ghcr.io/ohstr/ncli:rc
    hostname: relay
    restart: unless-stopped
    command: ["relay", "--config", "/config/relay.yaml"]
    volumes:
      - ./data/regtest/relay/relay.yaml:/config/relay.yaml:ro
      - ./data/regtest/relay:/data
    ports:
      # Published so the host-run integration suite reaches the same relay the
      # backend uses (see RELAY in .env.example).
      - "${RELAY_PORT:-5500}:5500"
    networks:
      - lokihub-dev

  # The Hub's node.
  flnd:
    build: &flnd-build
      # A worktree sits deeper than the main checkout, so set DEV_FLND_DIR,
      # DEV_WALLETD_DIR and DEV_FLOKICOIN_NEUTRINO_DIR (absolute) in its .env.
      context: ${DEV_FLND_DIR:-../flnd}
      dockerfile: dev.Dockerfile
      additional_contexts:
        walletd: ${DEV_WALLETD_DIR:-../walletd}
        flokicoin-neutrino: ${DEV_FLOKICOIN_NEUTRINO_DIR:-../flokicoin-neutrino}
    hostname: flnd
    restart: unless-stopped
    command:
      - --configfile=/config/flnd.conf
      - --tlsextradomain=${DEV_HOST:-localhost}
    volumes:
      - ./dev/regtest/flnd-hub.conf:/config/flnd.conf:ro
      - ./data/regtest/flnd:/root/.flnd
      - ./data/regtest/chain/rpc.cert:/chain/rpc.cert:ro
    healthcheck: &flnd-health
      test: ["CMD", "sh", "-c", "ls /root/.flnd/data/chain/flokicoin/regtest/admin.macaroon"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    ports:
      - "${FLND_RPC_PORT:-10005}:10005"
    depends_on:
      - chain
      - fees
    networks:
      - lokihub-dev

  # The external node and on-chain wallet the tests pay from and to.
  payer:
    build: *flnd-build
    hostname: payer
    restart: unless-stopped
    command:
      - --configfile=/config/flnd.conf
      - --tlsextradomain=${DEV_HOST:-localhost}
    volumes:
      - ./dev/regtest/flnd-payer.conf:/config/flnd.conf:ro
      - ./data/regtest/payer:/root/.flnd
      - ./data/regtest/chain/rpc.cert:/chain/rpc.cert:ro
    healthcheck: *flnd-health
    ports:
      - "${PAYER_RPC_PORT:-10006}:10006"
    depends_on:
      - chain
      - fees
    networks:
      - lokihub-dev

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    # air polls the tree instead of using inotify: the host's inotify instance
    # limit (fs.inotify.max_user_instances, often 128) is shared by every
    # container and runs out on a busy host ("too many open files").
    command: ["--build.poll", "true", "--build.poll_interval", "1000"]
    environment:
      - WORK_DIR=/data
      - PORT=1610
      - NETWORK=regtest
      - LOKIHUB_DEV_STACK=1
      # No BASE_URL/FRONTEND_URL: the stack is reached only through Caddy, and an
      # unset value makes /logout redirect to a same-origin "/".
      - LN_BACKEND_TYPE=FLND
      - FLND_ADDRESS=flnd:10005
      # No FLND_CERT_FILE: the flnd wrapper then skips verification, so tls.cert
      # need not be shared into this container.
      - FLND_MACAROON_FILE=/flnd-data/data/chain/flokicoin/regtest/admin.macaroon
      - RELAY=${RELAY:-ws://relay:5500}
      - AUTO_UNLOCK_PASSWORD=${DEV_UNLOCK_PASSWORD:?set DEV_UNLOCK_PASSWORD in .env (see .env.example)}
      - ENABLE_SWAP=false
      # The *_RATE_LIMIT_PER_HOUR values are not set here: the backend reads them
      # from .env at each start, so `just test integration-ratelimits` can change them.
      - LOG_LEVEL=${LOG_LEVEL:-4}
    # Docker's default nofile limit here is 1024, which air's watcher exceeds.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - .:/app
      - ./data/regtest/hub:/data
      - ./data/regtest/flnd:/flnd-data:ro
      - lokihub-go-mod-cache:/go/pkg/mod
      - lokihub-go-build-cache:/root/.cache/go-build
    depends_on:
      flnd:
        condition: service_healthy
      relay:
        condition: service_started
    networks:
      - lokihub-dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://backend:1610
      # Bind mounts often drop inotify events, which breaks HMR (vite.config.ts).
      - VITE_USE_POLLING=true
    depends_on:
      - backend
    networks:
      - lokihub-dev

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_PORT:-5610}:80"
      - "${CADDY_HTTPS_PORT:-5611}:443"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - lokihub-caddy-data:/data
    depends_on:
      - frontend
    networks:
      - lokihub-dev

networks:
  lokihub-dev:
    driver: bridge

volumes:
  lokihub-go-mod-cache:
  lokihub-go-build-cache:
  lokihub-caddy-data:

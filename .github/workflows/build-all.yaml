name: Build All Platforms

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    uses: ./.github/workflows/linux.yaml
    secrets: inherit

  macos:
    name: macOS
    uses: ./.github/workflows/macos.yaml
    secrets: inherit
    # Best-effort: a macOS failure or runner-capacity cancellation still leaves
    # the Linux+Windows artifacts intact, and release.yaml selects a build-all
    # run by per-version artifact presence (requiring only Linux+Windows) with
    # status=completed regardless of conclusion -- so a missing macOS degrades
    # the release gracefully. (`continue-on-error` is not a valid key on a
    # `uses:` reusable-workflow job, and is unnecessary given that selection.)

  windows:
    name: Windows
    uses: ./.github/workflows/windows.yaml
    secrets: inherit

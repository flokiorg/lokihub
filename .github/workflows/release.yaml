name: Release

# Build every platform and publish -- in ONE run, from ONE commit.
#
# macOS is MANDATORY. `publish` depends on linux AND macos AND windows, so the
# release cannot be created unless the .dmg exists. If the GitHub-hosted macOS
# runner is capacity-cancelled, the macos job is cancelled, publish is skipped,
# and NO release is produced (the old "degrade gracefully without macOS" posture
# is deliberately gone).
#
# Recover WITHOUT rebuilding Linux/Windows by re-running only the failed jobs:
#
#     gh run rerun --failed <run-id>        (or the "Re-run failed jobs" button)
#
# That re-runs just the cancelled macos job + publish and reuses the Linux/
# Windows artifacts already attached to the run. release-retry.yaml does this
# automatically, a bounded number of times, when a Release run fails on a macOS
# *cancellation* (a genuine macOS build *failure* is left for a human).
#
# Because build and publish share one run, the binaries, tag, release notes and
# commit are the same commit by construction. There is no cross-run artifact
# scavenging and no version-string run-selection -- the whole class of "released
# rc.8 with rc.7 binaries" staleness bug is structurally impossible here, so the
# guards the old decoupled design needed are gone with it.
#
# dry_run=true builds every platform but skips publish (a release-less test build
# -- this replaces the former build-all.yaml).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build all platforms but do not publish a release"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    uses: ./.github/workflows/linux.yaml
    secrets: inherit

  macos:
    name: macOS
    uses: ./.github/workflows/macos.yaml
    secrets: inherit

  windows:
    name: Windows
    uses: ./.github/workflows/windows.yaml
    secrets: inherit

  publish:
    name: Publish Release
    # macOS is in this list on purpose: no .dmg => this job never runs => no
    # release. Re-run failed jobs to retry macOS without rebuilding Linux/Windows.
    needs: [linux, macos, windows]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Version
        shell: bash
        run: |
          if [ ! -f VERSION ]; then
            echo "::error::VERSION file not found"
            exit 1
          fi
          TAG=$(cat VERSION | tr -d '[:space:]')
          if [ -z "$TAG" ]; then
            echo "::error::VERSION file is empty"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if [[ "$TAG" == *-* ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      # A pre-release (e.g. 0.5.0-rc.34) documents the version it is a candidate
      # for, so the notes live under that open "## [0.5.0]" section rather than
      # one heading per candidate -- mirrors how nmilat's CHANGELOG.md
      # accumulates an unreleased version across its rc's. A missing section is a
      # hard error: a release with no notes is a mistake, not a success.
      - name: Resolve Release Notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          NOTES_VERSION="${TAG%%-*}"
          NOTES=$(awk -v ver="$NOTES_VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]") > 0) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md)
          NOTES=$(printf '%s\n' "$NOTES" | sed -e '/./,$!d' -e ':a' -e '/^\n*$/{$d;N;ba' -e '}')
          if [ -z "$NOTES" ]; then
            echo "::error::no CHANGELOG.md section found for [$NOTES_VERSION] - write the release note and commit it before running this workflow"
            exit 1
          fi
          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Release note found for [$NOTES_VERSION] in CHANGELOG.md"

      # No run-id hunting: the platform jobs above are part of THIS run, so their
      # artifacts download straight from it. download-artifact with no `name`
      # fetches every artifact of the current run into artifacts/<name>/.
      - name: Download this run's build artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          path: artifacts

      - name: Display Artifacts
        run: ls -R artifacts

      - name: Verify artifacts (version + all platforms present)
        shell: bash
        run: |
          set -euo pipefail
          # Staleness guard: every file must carry exactly $TAG and NOT
          # $TAG-followed-by-a-digit, so an rc.2 release never accepts rc.21
          # binaries. (Cheap -- the version is in every asset's filename.)
          wrong=$(find artifacts -type f ! \( -name "*${TAG}*" -a ! -name "*${TAG}[0-9]*" \) | head -20 || true)
          if [ -n "$wrong" ]; then
            echo "::error::artifacts not carrying exactly ${TAG} were produced (wrong version):"
            echo "$wrong"
            exit 1
          fi
          versioned=$(find artifacts -type f -name "*${TAG}*" ! -name "*${TAG}[0-9]*")
          if [ -z "$versioned" ]; then
            echo "::error::no artifacts for ${TAG} were produced"
            exit 1
          fi
          # All three platforms are REQUIRED -- macOS included. `needs` already
          # guarantees each job succeeded; this is the belt-and-suspenders check
          # that each actually produced its named asset.
          for plat in linux macos windows; do
            if ! grep -qi "$plat" <<<"$versioned"; then
              echo "::error::no $plat artifacts for ${TAG} - cannot release; re-run failed jobs"
              exit 1
            fi
          done
          # macOS must include the desktop .dmg specifically (the one mandatory
          # asset this whole gate exists to protect).
          if ! grep -qiE 'desktop-macos.*\.dmg' <<<"$versioned"; then
            echo "::error::macOS desktop .dmg missing for ${TAG} - cannot release"
            exit 1
          fi
          echo "artifacts OK for ${TAG} ($(grep -c . <<<"$versioned") files)"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          body: ${{ steps.notes.outputs.notes }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
          prerelease: ${{ env.PRERELEASE }}

name: Release

on:
  workflow_dispatch:

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select the build-all run with artifacts for this version
        id: get_run_ids
        uses: actions/github-script@v7
        with:
          script: |
            // linux.yaml/macos.yaml/windows.yaml are invoked as reusable
            // workflows (workflow_call) from build-all.yaml, so their runs
            // don't show up under their own workflow_id via listWorkflowRuns
            // - the whole thing is one run, owned by build-all.yaml, with
            // each platform's artifacts attached to that single run.
            //
            // Pick the NEWEST completed build-all run whose artifacts carry the
            // VERSION being released - NOT merely the latest fully-successful run.
            // A single platform's runner being unavailable (e.g. macOS capacity)
            // cancels the whole build-all run, and "latest successful" would then
            // silently fall back to an older run that built a DIFFERENT version
            // (the staleness the verify step below guards against). Selecting by
            // version keeps Linux/Windows releasable when macOS can't run, and is
            // strictly more correct than the run's overall conclusion.
            const fs = require('fs');
            const tag = fs.readFileSync('VERSION', 'utf8').trim();
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-all.yaml',
              per_page: 30,
            });
            let runId = null;
            for (const run of runs.data.workflow_runs) {
              if (run.status !== 'completed') continue;
              const arts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });
              if (arts.data.artifacts.some(a => a.name.includes(tag))) {
                runId = run.id;
                break;
              }
            }
            if (!runId) core.setFailed(`No completed build-all.yaml run has artifacts for ${tag} - run build-all.yaml on this commit first.`);

            console.log(`Selected build-all.yaml run ${runId} for ${tag}`);
            core.setOutput('run_id', runId);

      - name: Read Version
        id: version
        shell: bash
        run: |
          if [ ! -f VERSION ]; then
            echo "Error: VERSION file not found"
            exit 1
          fi
          TAG=$(cat VERSION | tr -d '[:space:]')
          if [ -z "$TAG" ]; then
            echo "Error: VERSION file is empty"
            exit 1
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          if [[ "$TAG" == *-* ]]; then
            echo "PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "PRERELEASE=false" >> $GITHUB_ENV
          fi

      # A missing note used to set exists=false, which if:-gated off every
      # remaining step -- so the job reported success having published
      # nothing. That actually happened: releases/0.5.0-rc.4.md was committed
      # and never released, and nobody noticed. Fail instead.
      #
      # A pre-release (0.5.0-rc.9) documents the version it is a candidate
      # for, so the notes live under that open "## [0.5.0]" section rather
      # than one heading per candidate -- mirrors how nmilat's CHANGELOG.md
      # accumulates an unreleased version across its own rc's.
      - name: Resolve Release Notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          NOTES_VERSION="${TAG%%-*}"

          NOTES=$(awk -v ver="$NOTES_VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]") > 0) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md)
          NOTES=$(printf '%s\n' "$NOTES" | sed -e '/./,$!d' -e ':a' -e '/^\n*$/{$d;N;ba' -e '}')

          if [ -z "$NOTES" ]; then
            echo "::error::no CHANGELOG.md section found for [$NOTES_VERSION] - write the release note and commit it before running this workflow"
            exit 1
          fi

          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Release note found for [$NOTES_VERSION] in CHANGELOG.md"

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          run-id: ${{ steps.get_run_ids.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts

      - name: Display Artifacts
        run: ls -R artifacts

      # build-all.yaml is harvested by "latest successful run", which says
      # nothing about which commit it built. Releasing 0.5.0-rc.8 once attached
      # 18 files all named 0.5.0-rc.7, built ten days earlier: the notes
      # described changes the binaries did not contain. Every asset carries the
      # version in its filename, so the check is cheap.
      - name: Verify artifacts match the version being released
        shell: bash
        run: |
          set -euo pipefail
          # Staleness guard (kept): every downloaded file must carry the version.
          # Releasing 0.5.0-rc.8 once attached 18 files all named 0.5.0-rc.7; the
          # version is in every asset's filename, so the check is cheap.
          wrong=$(find artifacts -type f ! -name "*${{ env.TAG }}*" | head -20 || true)
          if [ -n "$wrong" ]; then
            echo "::error::artifacts not carrying ${{ env.TAG }} were downloaded (wrong version/run):"
            echo "$wrong"
            exit 1
          fi
          versioned=$(find artifacts -type f -name "*${{ env.TAG }}*")
          if [ -z "$versioned" ]; then
            echo "::error::no artifacts for ${{ env.TAG }} were downloaded"
            exit 1
          fi
          # Linux + Windows are required; macOS is best-effort. A macOS runner
          # outage (observed: jobs cancelled at allocation on an Actions capacity
          # /minutes limit) must degrade the release gracefully, not halt it -
          # ship Linux/Windows now and add macOS with a re-run when it returns.
          for plat in linux windows; do
            if ! grep -qi "$plat" <<<"$versioned"; then
              echo "::error::no $plat artifacts for ${{ env.TAG }} - cannot release without a required platform"
              exit 1
            fi
          done
          if ! grep -qi macos <<<"$versioned"; then
            echo "::warning::no macOS artifacts for ${{ env.TAG }} - releasing Linux/Windows only (macOS runner unavailable). Re-run build-all.yaml when macOS capacity returns, then re-run this workflow to attach the macOS build."
          fi
          echo "artifacts OK for ${{ env.TAG }} ($(grep -c . <<<"$versioned") files)"


      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          body: ${{ steps.notes.outputs.notes }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
          prerelease: ${{ env.PRERELEASE }}

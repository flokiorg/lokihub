name: Release

# Lean by default, extras opt-in per release.
#
# Every rc builds and publishes ONLY the Linux server binaries (amd64+arm64) --
# the artifacts that actually get deployed. The desktop packages, Windows, and
# the macOS .dmg are NOT built unless this release opts in, because most rc's
# aren't going to test them and shipping an untested artifact is worse than
# omitting it.
#
#   include_linux_desktop  -> adds Linux .deb/.rpm/.AppImage (full arch matrix)
#   include_windows        -> adds the Windows desktop build
#   include_macos          -> builds the .dmg on Codemagic (external; GitHub-hosted
#                             macOS runners are capacity-unreliable) and attaches it
#
# Publish gate: Linux server is always required; an opted-in platform that FAILS
# blocks the release; a platform that wasn't opted in is simply absent. So you
# never ship a release missing something you asked for, and never wait on
# something you didn't. build-and-publish share one run, so binaries/tag/notes
# are one commit by construction.
#
# dry_run=true builds the selected platforms but publishes nothing.

on:
  workflow_dispatch:
    inputs:
      include_linux_desktop:
        description: "Also build Linux desktop (.deb/.rpm/.AppImage)"
        type: boolean
        default: false
      include_windows:
        description: "Also build the Windows desktop app"
        type: boolean
        default: false
      include_macos:
        description: "Also build the macOS .dmg (via Codemagic)"
        type: boolean
        default: false
      dry_run:
        description: "Build selected platforms but do not publish"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux-server:
    name: Linux server
    uses: ./.github/workflows/linux-server.yaml
    secrets: inherit

  linux-desktop:
    name: Linux desktop
    if: ${{ inputs.include_linux_desktop }}
    uses: ./.github/workflows/linux-desktop.yaml
    secrets: inherit

  windows:
    name: Windows
    if: ${{ inputs.include_windows }}
    uses: ./.github/workflows/windows.yaml
    secrets: inherit

  macos:
    name: macOS (Codemagic)
    if: ${{ inputs.include_macos }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Version
        shell: bash
        run: |
          TAG=$(cat VERSION | tr -d '[:space:]')
          [ -n "$TAG" ] || { echo "::error::VERSION empty"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build .dmg on Codemagic and download it
        env:
          CM_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          CM_APP_ID: ${{ secrets.CODEMAGIC_APP_ID }}
          CM_WORKFLOW: lokihub-macos
          REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CM_TOKEN:-}" ] || [ -z "${CM_APP_ID:-}" ]; then
            echo "::error::include_macos=true but CODEMAGIC_API_TOKEN / CODEMAGIC_APP_ID secrets are not set. Connect Codemagic first (see codemagic.yaml)."
            exit 1
          fi
          echo "Triggering Codemagic build ($CM_WORKFLOW on $REF)..."
          build_id=$(curl -sS -X POST https://api.codemagic.io/builds \
            -H "x-auth-token: $CM_TOKEN" -H "Content-Type: application/json" \
            -d "{\"appId\":\"$CM_APP_ID\",\"workflowId\":\"$CM_WORKFLOW\",\"branch\":\"$REF\"}" \
            | jq -r '.buildId')
          if [ -z "$build_id" ] || [ "$build_id" = "null" ]; then
            echo "::error::Codemagic did not return a buildId"; exit 1
          fi
          echo "Codemagic buildId=$build_id; polling..."
          status=""
          for _ in $(seq 1 120); do          # up to ~60 min (30s * 120)
            sleep 30
            resp=$(curl -sS https://api.codemagic.io/builds/"$build_id" -H "x-auth-token: $CM_TOKEN")
            status=$(echo "$resp" | jq -r '.build.status')
            echo "  status=$status"
            case "$status" in
              finished) break ;;
              failed|timeout|canceled|skipped) echo "::error::Codemagic build $status"; exit 1 ;;
            esac
          done
          [ "$status" = "finished" ] || { echo "::error::Codemagic build did not finish in time (last status: $status)"; exit 1; }
          mkdir -p ops/bin
          out="ops/bin/lokihub-desktop-macos-${TAG}.dmg"
          # Codemagic may expose the .dmg directly, or inside its artifacts bundle
          # zip (<project>_<n>_artifacts.zip). Handle both.
          dmg_url=$(echo "$resp" | jq -r '.build.artefacts[]? | select(.name|endswith(".dmg")) | .url' | head -1)
          if [ -n "$dmg_url" ] && [ "$dmg_url" != "null" ]; then
            echo "Downloading .dmg: $dmg_url"
            curl -sSL -H "x-auth-token: $CM_TOKEN" -o "$out" "$dmg_url"
          else
            bundle_url=$(echo "$resp" | jq -r '.build.artefacts[]? | select(.name|endswith(".zip")) | .url' | head -1)
            [ -n "$bundle_url" ] && [ "$bundle_url" != "null" ] || { echo "::error::no .dmg or bundle artifact in Codemagic build"; exit 1; }
            echo "Downloading bundle: $bundle_url"
            curl -sSL -H "x-auth-token: $CM_TOKEN" -o /tmp/cm-bundle.zip "$bundle_url"
            unzip -o -j /tmp/cm-bundle.zip '*.dmg' -d ops/bin/
            found=$(ls ops/bin/*.dmg 2>/dev/null | head -1)
            [ -n "$found" ] || { echo "::error::Codemagic bundle contained no .dmg"; exit 1; }
            [ "$found" = "$out" ] || mv "$found" "$out"
          fi
          ls -lh ops/bin/*.dmg

      - name: Upload Artifacts (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-macos-${{ env.TAG }}
          path: ops/bin/*.dmg
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: [linux-server, linux-desktop, windows, macos]
    # Run unless cancelled, as long as the always-on Linux server succeeded and
    # every OTHER platform either succeeded or was skipped (i.e. not opted in).
    # An opted-in platform that failed leaves its result = 'failure' and blocks.
    if: >-
      ${{ !cancelled() && !inputs.dry_run &&
          needs.linux-server.result == 'success' &&
          needs.linux-desktop.result != 'failure' &&
          needs.windows.result != 'failure' &&
          needs.macos.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Version
        shell: bash
        run: |
          [ -f VERSION ] || { echo "::error::VERSION file not found"; exit 1; }
          TAG=$(cat VERSION | tr -d '[:space:]')
          [ -n "$TAG" ] || { echo "::error::VERSION file is empty"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if [[ "$TAG" == *-* ]]; then echo "PRERELEASE=true" >> "$GITHUB_ENV"; else echo "PRERELEASE=false" >> "$GITHUB_ENV"; fi

      - name: Resolve Release Notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          NOTES_VERSION="${TAG%%-*}"
          NOTES=$(awk -v ver="$NOTES_VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]") > 0) { found=1; next } }
            found { print }
          ' CHANGELOG.md)
          NOTES=$(printf '%s\n' "$NOTES" | sed -e '/./,$!d' -e ':a' -e '/^\n*$/{$d;N;ba' -e '}')
          if [ -z "$NOTES" ]; then
            echo "::error::no CHANGELOG.md section found for [$NOTES_VERSION] - write the release note and commit it first"
            exit 1
          fi
          { echo "notes<<RELEASE_NOTES_EOF"; echo "$NOTES"; echo "RELEASE_NOTES_EOF"; } >> "$GITHUB_OUTPUT"

      - name: Download this run's build artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          path: artifacts

      - name: Display Artifacts
        run: ls -R artifacts

      - name: Verify artifacts (version + required/opted-in platforms)
        shell: bash
        env:
          WANT_LINUX_DESKTOP: ${{ inputs.include_linux_desktop }}
          WANT_WINDOWS: ${{ inputs.include_windows }}
          WANT_MACOS: ${{ inputs.include_macos }}
        run: |
          set -euo pipefail
          # Staleness guard: every file carries exactly $TAG, not $TAG+digit.
          wrong=$(find artifacts -type f ! \( -name "*${TAG}*" -a ! -name "*${TAG}[0-9]*" \) | head -20 || true)
          if [ -n "$wrong" ]; then echo "::error::artifacts not carrying ${TAG}:"; echo "$wrong"; exit 1; fi
          versioned=$(find artifacts -type f -name "*${TAG}*" ! -name "*${TAG}[0-9]*")
          [ -n "$versioned" ] || { echo "::error::no artifacts for ${TAG}"; exit 1; }
          # Always required: Linux server for both arches.
          for want in "lokihub-server-linux-amd64" "lokihub-server-linux-arm64"; do
            grep -q "$want" <<<"$versioned" || { echo "::error::missing required $want"; exit 1; }
          done
          # Opted-in platforms must have delivered their asset.
          [ "$WANT_LINUX_DESKTOP" != "true" ] || grep -qiE 'desktop-linux.*\.(deb|rpm|AppImage)' <<<"$versioned" || { echo "::error::include_linux_desktop set but no desktop package"; exit 1; }
          [ "$WANT_WINDOWS" != "true" ] || grep -qi 'windows' <<<"$versioned" || { echo "::error::include_windows set but no windows asset"; exit 1; }
          [ "$WANT_MACOS" != "true" ] || grep -qiE 'macos.*\.dmg' <<<"$versioned" || { echo "::error::include_macos set but no .dmg"; exit 1; }
          echo "artifacts OK for ${TAG} ($(grep -c . <<<"$versioned") files)"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          body: ${{ steps.notes.outputs.notes }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
          prerelease: ${{ env.PRERELEASE }}

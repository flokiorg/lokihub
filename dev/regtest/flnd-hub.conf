; The Hub's flnd on the regtest dev stack (docker-compose.dev.yml `flnd`).
; Regtest only: `just dev up` refuses to start if this file names another network.

[Application Options]
noseedbackup=true
; Both bootstrap channels are opened before either confirms.
maxpendingchannels=10
rpclisten=0.0.0.0:10005
listen=0.0.0.0:9735
tlsextradomain=flnd
tlsextradomain=localhost
debuglevel=info
alias=lokihub-regtest-hub

[Flokicoin]
flokicoin.regtest=true
flokicoin.node=btcd
flokicoin.defaultchanconfs=1

[btcd]
btcd.rpchost=chain:25213
btcd.rpcuser=dev
btcd.rpcpass=dev
btcd.rpccert=/chain/rpc.cert

[fee]
; A fixed regtest estimate from the compose `fees` service, until lokid answers
; estimatefee (see docker-compose.dev.yml).
fee.url=http://fees:8080/fees.json

[protocol]
protocol.option-scid-alias=true
protocol.zero-conf=true

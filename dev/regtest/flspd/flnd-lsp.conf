; flnd-lsp: the node of flspd, the test LSP on the regtest dev stack
; (docker-compose.dev.yml, LP-13). From flspd's deploy/regtest/flnd-lsp.conf.sample.
; Regtest only.

[Application Options]
noseedbackup=true
maxpendingchannels=10
rpclisten=0.0.0.0:10007
listen=0.0.0.0:9735
tlsextradomain=flnd-lsp
tlsextradomain=localhost
debuglevel=info
alias=lokihub-regtest-lsp
; flspd decides every HTLC forward (JIT channels), so flnd waits for its
; interceptor rather than forwarding without it.
requireinterceptor=true

[Flokicoin]
flokicoin.regtest=true
flokicoin.node=btcd
flokicoin.defaultchanconfs=1

[btcd]
btcd.rpchost=chain:25213
btcd.rpcuser=dev
btcd.rpcpass=dev
btcd.rpccert=/chain/rpc.cert

[fee]
fee.url=http://fees:8080/fees.json

[protocol]
; JIT channels are zero-conf channels with an alias SCID.
protocol.option-scid-alias=true
protocol.zero-conf=true
